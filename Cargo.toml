[workspace]
resolver = "2"
members = [
    "crates/lint-core",
    "crates/lint-rules",
    "crates/lint-report",
    "crates/lint-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Mossad-esc/soroban-lint"
homepage = "https://github.com/Mossad-esc/soroban-lint"
readme = "README.md"
authors = ["soroban-lint contributors"]
keywords = ["soroban", "stellar", "static-analysis", "linter", "smart-contracts"]
categories = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
lint-core = { path = "crates/lint-core", version = "0.1.0" }
lint-rules = { path = "crates/lint-rules", version = "0.1.0" }
lint-report = { path = "crates/lint-report", version = "0.1.0" }

syn = { version = "2", features = ["full", "visit", "extra-traits", "parsing", "printing"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
cargo_metadata = "0.18"
ignore = "0.4"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
petgraph = "0.6"
rayon = "1"
insta = { version = "1", features = ["yaml"] }
assert_cmd = "2"
predicates = "3"
tempfile = "3"
annotate-snippets = "0.11"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
