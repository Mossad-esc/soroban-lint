[workspace]
resolver = "2"
members = [
    "crates/lint-core",
    "crates/lint-rules",
    "crates/lint-report",
    "crates/lint-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Mossad-esc/soroban-lint"
homepage = "https://github.com/Mossad-esc/soroban-lint"
readme = "README.md"
authors = ["soroban-lint contributors"]
keywords = ["soroban", "stellar", "static-analysis", "linter", "smart-contracts"]
categories = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
lint-core = { path = "crates/lint-core", version = "0.1.0" }
lint-rules = { path = "crates/lint-rules", version = "0.1.0" }
lint-report = { path = "crates/lint-report", version = "0.1.0" }

syn = { version = "2", features = ["full", "visit", "extra-traits", "parsing", "printing"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
cargo_metadata = "0.18"
ignore = "0.4"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
petgraph = "0.6"
rayon = "1"
insta = { version = "1", features = ["yaml"] }
assert_cmd = "2"
predicates = "3"
tempfile = "3"
annotate-snippets = "0.11"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# ── Release profile ───────────────────────────────────────────────────────────
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
# Overflow checks in release builds — critical for a security tool.
overflow-checks = true

# ── cargo-dist configuration ─────────────────────────────────────────────────
# https://opensource.axo.dev/cargo-dist/
[workspace.metadata.dist]
# The binary to distribute (must match [[bin]] name in lint-cli/Cargo.toml).
cargo-dist-version = "0.32.0"
# Tag pattern: v0.1.0 or v0.1.0-rc.1
tag-pattern = "v[0-9]+.[0-9]+.[0-9]+*"
# Build targets
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]
# Produce .tar.gz archives for unix, .zip for windows, and SHA-256 checksums.
install-updater = false
create-release = true

