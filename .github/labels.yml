# GitHub labels for soroban-lint
# Apply with: gh label import .github/labels.yml
# or use a tool like github-label-sync.

- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers — well-scoped, documented, and approachable"

- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed; maintainers welcome contributions"

- name: "new rule"
  color: "e4e669"
  description: "Proposal or implementation of a new soroban-lint rule"

- name: "false positive"
  color: "d93f0b"
  description: "soroban-lint incorrectly reported a finding"

- name: "false negative"
  color: "e99695"
  description: "soroban-lint missed a finding it should have reported"

- name: "docs"
  color: "0075ca"
  description: "Documentation improvements or additions"

- name: "ci"
  color: "0052cc"
  description: "Changes to CI/CD workflows, GitHub Actions, or build infrastructure"

- name: "needs-readme-change"
  color: "f9d0c4"
  description: "This change requires a corresponding update to README.md"

- name: "bug"
  color: "d73a4a"
  description: "Something is not working correctly in the tool itself"

- name: "enhancement"
  color: "a2eeef"
  description: "New feature or improvement to existing functionality"
