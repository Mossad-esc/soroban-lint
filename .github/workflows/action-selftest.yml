name: action-selftest

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftest-safe:
    name: Safe fixtures must pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run action against safe fixtures
        uses: ./
        with:
          path: tests/fixtures/safe
          format: pretty
          fail-on: error

  selftest-vulnerable:
    name: Vulnerable fixtures must fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run action against vulnerable fixtures (expected to fail)
        id: lint_vulnerable
        uses: ./
        with:
          path: tests/fixtures/vulnerable
          format: pretty
          fail-on: error
        continue-on-error: true

      - name: Assert vulnerable fixtures produced findings
        shell: bash
        run: |
          if [ "${{ steps.lint_vulnerable.outcome }}" != "failure" ]; then
            echo "Expected soroban-lint to fail on vulnerable fixtures, but it succeeded."
            exit 1
          fi
          echo "Correctly detected findings in vulnerable fixtures."
